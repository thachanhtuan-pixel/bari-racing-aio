<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bari Racing AIO - Bari RACING All-in-One</title>
    <meta name="description" content="Bari Racing AIO (Bari RACING All-in-One) - ứng dụng Web-app PWA đa chức năng chuyên sâu về xe máy, tính toán cơ khí động cơ, chẩn đoán bắt bệnh âm thanh, mô phỏng Virtual Dyno và GPS Road Test." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BariRacing" />
    <link rel="apple-touch-icon" href="/bari_racing_1x1.png" />
    <link rel="icon" type="image/png" href="/bari_racing_1x1.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Bari Racing AIO - Bari RACING All-in-One" />
    <meta property="og:description" content="Ứng dụng Web-app PWA đa chức năng chuyên sâu về xe máy: Tính dung tích, tỉ số nén, họng gió, Virtual Dyno và chẩn đoán bệnh xe." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Chakra Petch, Share Tech Mono for Industrial Gothic Y2K -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#e0e0e0] font-sans antialiased selection:bg-[#39FF14] selection:text-black overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[BariRacing] PWA SW registered successfully', reg.scope))
            .catch(err => console.log('[BariRacing] PWA SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
